<!DOCTYPE html>
<html>
<head>
    <title>Project 1</title>
</head>
<body id="all-everything">

    <h1 id="main-title" class="texty">MobMec</h1>

    <button id="menu-btn">Menu</button>

    <div id="navbar">
        <p class="texty">Home</p>
        <p class="texty">Services</p>
        <p class="texty">Contact</p>
    </div>

    <button id="theme-btn">Change Theme</button>

    <script>
        const menuButton = document.getElementById("menu-btn");
        const navbarhai = document.getElementById("navbar");
        menuButton.addEventListener("click", function(){
            if (navbarhai.style.display == "none") {
                navbarhai.style.display = "block";
            } else {
                navbarhai.style.display = "none";
            }
        });
        const themer = document.getElementById("theme-btn");
        const text_themer = document.getElementsByClassName("texty");
        
        themer.addEventListener("click", function(){
            if (document.body.style.backgroundColor == "black"){
                    document.body.style.backgroundColor = "white";
                    // text_themer
                    document.body.style.color = "black";
            }
            else{
                document.body.style.backgroundColor = "black";
                // textthemer."white" ;
                document.body.style.color = "white";
            }
        });
    </script>

</body>
</html>
